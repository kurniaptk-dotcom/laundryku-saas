<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Washing Machine Body -->
  <g filter="url(#shadow)">
    <rect x="96" y="80" width="320" height="352" rx="48" fill="#ffffff" />
    <rect x="96" y="80" width="320" height="88" rx="48" fill="#f8fafc" />
    
    <!-- Controls on Machine -->
    <circle cx="160" cy="124" r="18" fill="#0284c7" />
    <circle cx="216" cy="124" r="8" fill="#cbd5e1" />
    <circle cx="248" cy="124" r="8" fill="#cbd5e1" />
    <circle cx="280" cy="124" r="8" fill="#cbd5e1" />
    <rect x="330" y="112" width="54" height="24" rx="12" fill="#0284c7" />
    
    <!-- Drum Outer Ring -->
    <circle cx="256" cy="284" r="105" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="6" />
    <circle cx="256" cy="284" r="86" fill="url(#circleGrad)" />
    
    <!-- Drum Glass Reflection & Water Wave -->
    <path d="M 175 295 Q 215 320 256 295 T 337 295 A 86 86 0 0 1 175 295 Z" fill="#0284c7" opacity="0.6" />
    <circle cx="225" cy="250" r="14" fill="url(#bubbleGrad)" />
    <circle cx="270" cy="240" r="8" fill="url(#bubbleGrad)" />
    <circle cx="290" cy="275" r="10" fill="url(#bubbleGrad)" />
  </g>
  
  <!-- Sparkles -->
  <path d="M 390 85 L 398 105 L 418 113 L 398 121 L 390 141 L 382 121 L 362 113 L 382 105 Z" fill="#facc15" />
  <path d="M 120 400 L 125 412 L 137 417 L 125 422 L 120 434 L 115 422 L 103 417 L 115 412 Z" fill="#38bdf8" />
</svg>
